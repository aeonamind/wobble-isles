name: Deploy

# Continuous deployment to wobble.eugenebox.uk (same flow as the owner's other games):
#   build the server image → push aeonamind/wobble-isles:<sha> to Docker Hub
#   → bump infra/wobble-isles/values.yaml in aeonamind/gitops → Argo CD syncs it.
# Runs on main, and on playtest/** branches to try a branch before it merges.
on:
  push:
    branches: ["main", "playtest/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: aeonamind/wobble-isles

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitops:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: aeonamind/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
      - name: Bump the image tag (with retry)
        env:
          TAG: ${{ github.sha }}
          VALUES: infra/wobble-isles/values.yaml
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          delay=2
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            test -f "$VALUES" || { echo "::error::$VALUES is missing: merge the wobble-isles chart into gitops first"; exit 1; }
            yq eval ".image.tag = \"$TAG\"" -i "$VALUES"
            if git diff --quiet; then echo "Already at $TAG"; exit 0; fi
            git commit -am "chore(wobble-isles): deploy $TAG"
            if git push origin main; then exit 0; fi
            sleep $delay; delay=$((delay * 2))
          done
          echo "::error::could not push to gitops"
          exit 1
