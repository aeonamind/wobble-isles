name: Release

# Push a version tag (made by `npm version`, see docs/RELEASING.md) to publish a release:
#   checks → desktop installers for Windows, macOS, Linux (+ signed auto-update files)
#   → GitHub Release with the CHANGELOG section → server image on Docker Hub.
# "Run workflow" by hand does a test build instead: installers as run artifacts, nothing published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  IS_RELEASE: ${{ github.ref_type == 'tag' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: version
        name: Version must match the tag
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$IS_RELEASE" = true ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1
          fi
          grep -q "^version = \"$V\"" src-tauri/Cargo.toml || { echo "::error::src-tauri/Cargo.toml is not at $V (use npm version)"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - id: release
        name: Create draft release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          node tools/release-notes.mjs "$V" > notes.md
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
            -f tag_name="$GITHUB_REF_NAME" -f name="Wobble Isles $V" -F body=@notes.md -F draft=true --jq .id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  app:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Default game server baked into the app (repository variable, e.g. wss://play.example.com).
      VITE_SERVER_URL: ${{ vars.APP_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
      - name: Keep test-build installers
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wobble-isles-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: ignore

  docker:
    # Server image on Docker Hub. Needs the DOCKERHUB_REPO variable (e.g. yourname/wobble-isles)
    # and the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets; skipped until they are set.
    needs: prepare
    if: github.ref_type == 'tag' && vars.DOCKERHUB_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_REPO }}:${{ needs.prepare.outputs.version }}
            ${{ vars.DOCKERHUB_REPO }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    # Only once every installer is uploaded: the auto-updater reads the latest published release.
    needs: [prepare, app]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release_id }}" -X PATCH -F draft=false -f make_latest=true
