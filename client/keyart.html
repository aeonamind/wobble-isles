<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wobble Isles · key art</title>
    <!--
      Dev-only page (not part of the build): renders the key art with the game's own models.
      Open http://localhost:5180/keyart.html?w=1920&h=1080 (add &text=0 for the clean background)
      and screenshot it once window.keyartReady is true.
    -->
    <style>
      html, body { margin: 0; overflow: hidden; background: #ffb3d9; font-family: "Trebuchet MS", system-ui, sans-serif; }
      #title { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; }
      #title h1 {
        margin: 0; font-weight: 900; letter-spacing: 0.02em; color: #ff4f8b;
        -webkit-text-stroke: 0.06em #3a2450; paint-order: stroke fill;
        text-shadow: 0 0.07em 0 #3a2450, 0 0.14em 0.2em rgba(58, 36, 80, 0.25);
      }
      #title p { margin: 0.35em 0 0; font-weight: 800; color: #3a2450; }
      #title .pill { display: inline-block; margin-top: 0.6em; padding: 0.3em 0.9em; border-radius: 999px; background: #fff; border: 0.12em solid #3a2450; font-weight: 800; color: #3a2450; }
    </style>
  </head>
  <body>
    <div id="title">
      <h1>Wobble Isles</h1>
      <p>A jelly party royale in the sky</p>
      <div class="pill">Party with 2–8 friends · Play in your browser</div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { WobblerView, PLAYER_COLORS } from "./src/render/wobbler";
      import { makeCrown } from "./src/render/crown";
      import { addOutline, gradientTexture, stripeTexture, toon } from "./src/render/toon";

      // Seeded randomness (sprinkles, blink timers) so every render is the same picture
      let seed = 7;
      Math.random = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;

      const q = new URLSearchParams(location.search);
      const W = Number(q.get("w") ?? 1920);
      const H = Number(q.get("h") ?? 1080);
      const showText = q.get("text") !== "0";
      const square = W / H < 1.3;

      const title = document.getElementById("title");
      title.hidden = !showText;
      title.style.top = `${H * (square ? 0.045 : 0.05)}px`;
      title.querySelector("h1").style.fontSize = `${Math.min(W * 0.09, H * 0.13)}px`;
      title.querySelector("p").style.fontSize = `${Math.min(W * 0.027, H * 0.038)}px`;
      title.querySelector(".pill").style.fontSize = `${Math.min(W * 0.02, H * 0.028)}px`;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = gradientTexture("#FFB3D9", "#FFF1C9");
      scene.fog = new THREE.Fog(0xffd6e6, 30, 70);
      scene.add(new THREE.HemisphereLight(0xfff4fb, 0xc9a7d8, 1.5));
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(6, 12, 8);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 });
      scene.add(sun);

      const camera = new THREE.PerspectiveCamera(square ? 50 : 42, W / H, 0.1, 200);
      camera.position.set(square ? 0.8 : 0.5, 2.2, square ? 7.4 : 8.2);
      camera.lookAt(square ? 0.8 : 0.5, square ? 2.2 : 1.9, 0);

      // Floating island: frosting top, biscuit underside
      function island(x, y, z, r, top, under, shadow = true) {
        const g = new THREE.Group();
        const cap = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.96, 0.6, 48), toon(top));
        cap.receiveShadow = shadow;
        addOutline(cap, 0.05);
        const rock = new THREE.Mesh(new THREE.ConeGeometry(r * 0.94, r * 1.3, 9), toon(under));
        rock.rotation.x = Math.PI;
        rock.position.y = -0.3 - r * 0.65;
        addOutline(rock, 0.05);
        g.add(cap, rock);
        g.position.set(x, y - 0.3, z);
        scene.add(g);
        return g;
      }
      island(0, 0, 0, 7, 0xffe3ee, 0xf2c28b);
      island(-13, -1.5, -14, 3.2, 0xf5faff, 0x9ee7f5); // Frost
      island(14, 0.5, -16, 3.6, 0xf4d7a1, 0x5bb4ff); // Toy

      // Sprinkles on the frosting
      const sprinkleColors = [0xff7eb6, 0x57d9b7, 0xffe156, 0x4db8ff, 0x9b6bff];
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 1 + Math.sqrt(Math.random()) * 5.6;
        const s = new THREE.Mesh(new THREE.CapsuleGeometry(0.035, 0.12, 2, 6), toon(sprinkleColors[i % 5]));
        s.position.set(Math.cos(a) * r, 0.02, Math.sin(a) * r);
        s.rotation.set(Math.PI / 2, 0, Math.random() * Math.PI);
        scene.add(s);
      }

      // Clouds
      function cloud(x, y, z, s) {
        const g = new THREE.Group();
        const m = toon(0xffffff);
        for (const [dx, dy, r] of [[0, 0, 1], [1.1, -0.2, 0.75], [-1.1, -0.25, 0.8], [0.4, 0.5, 0.7], [-0.5, 0.35, 0.6]]) {
          const b = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m);
          b.position.set(dx, dy, 0);
          g.add(b);
        }
        g.scale.set(s * 1.3, s * 0.8, s);
        g.position.set(x, y, z);
        scene.add(g);
      }
      cloud(-9, -2.5, -3, 2.2); cloud(9.5, -2, -4, 2.4); cloud(-18, 2, -22, 2.5); cloud(20, 4, -26, 3);
      cloud(4, 7, -30, 2); cloud(-7, -4.5, 3, 1.8); cloud(7, -5, 4, 1.6);

      // Hazard: striped sweeper on a post
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 1.0, 16), toon(0x3a2450));
      post.position.set(4.6, 0.5, -3.6);
      addOutline(post, 0.04);
      const barTex = stripeTexture("#FF4F5E", "#FFFFFF");
      barTex.repeat.set(12, 1);
      barTex.magFilter = THREE.LinearFilter;
      const bar = new THREE.Mesh(new THREE.BoxGeometry(6.5, 0.45, 0.45), toon(0xffffff, { map: barTex }));
      bar.position.set(4.6, 0.85, -3.6);
      bar.rotation.y = 0.35;
      bar.castShadow = true;
      addOutline(bar, 0.04);
      scene.add(post, bar);

      // Jelly bouncer
      const bouncer = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.2, 0.35, 32), toon(0x57d9b7, { transparent: true, opacity: 0.9 }));
      bouncer.position.set(-5.2, 0.17, -2.0);
      addOutline(bouncer, 0.04);
      scene.add(bouncer);

      // The crown on a pedestal, glowing
      const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 1.6, 24), toon(0xffffff, { map: stripeTexture("#FFC93C", "#FFF3C4", 3) }));
      ped.position.set(0.9, 0.8, -6);
      ped.castShadow = true;
      addOutline(ped, 0.04);
      const crown = makeCrown(2.1);
      crown.position.set(0.9, 2.05, -6);
      crown.rotation.set(0.15, 0.4, -0.12);
      const glow = new THREE.Mesh(new THREE.SphereGeometry(1.2, 24, 16), new THREE.MeshBasicMaterial({ color: 0xffe79a, transparent: true, opacity: 0.25, depthWrite: false }));
      glow.position.copy(crown.position);
      scene.add(ped, crown, glow);

      // The cast (colour index, style, frame overrides). Facing 0 looks at the camera.
      const base = { x: 0, y: 0.625, z: 0, vx: 0, vy: 0, vz: 0, facing: 0, state: "normal", stateTime: 0, grounded: true, grabbing: false, holding: false, invulnerable: false, squashed: false };
      const cast = [
        // Hero: Sky Bean hopping for joy, front and centre
        [4, "bean", { x: 0, y: 1.05, z: 1.6, grounded: false, vy: 4, facing: 0.1 }],
        // Bubblegum leaping in, arms flung out
        [0, "gumdrop", { x: 2.1, y: 1.25, z: 1.7, grounded: false, vy: 3, vx: -2, facing: -0.55 }],
        // Lemon sprinting in from the left
        [2, "bean", { x: -3.1, y: 0.625, z: 1.5, vx: 3, vz: 3, facing: 0.9 }],
        // Grape sent flying by the sweeper
        [5, "drop", { x: 3.4, y: 2.5, z: -2.6, state: "ragdoll", grounded: false, vx: -3, vy: 3 }],
        // Head Bounce: Mint springs off Tangerine's head
        [3, "bean", { x: -1.9, y: 1.3, z: -0.9, grounded: false, vy: 6, facing: 0.4 }],
        [1, "gumdrop", { x: -1.9, y: 0.625, z: -0.9, squashed: true, facing: 0.3 }],
        // Cocoa grabbing Marshmallow
        [6, "bean", { x: 4.3, y: 0.625, z: -0.9, grabbing: true, facing: 1.75 }],
        [7, "drop", { x: 5.3, y: 0.625, z: -1.2, facing: 0.7, vx: 1 }],
      ];
      const views = cast.map(([c, style, o]) => {
        const v = new WobblerView(PLAYER_COLORS[c], style);
        v.root.traverse((m) => { if (m.isMesh && !m.userData.outline) m.castShadow = true; });
        scene.add(v.root);
        return [v, { ...base, ...o }];
      });
      // Faces: joy for the leapers, a dizzy pancake under the stomp
      views[0][0].setExpression("happy", 999);
      views[4][0].setExpression("happy", 999);
      views[1][0].setExpression("shocked", 999);
      views[5][0].setExpression("dizzy", 999);
      views[6][0].setExpression("strain", 999);
      views[7][0].setExpression("shocked", 999);
      // Let the springs settle into their poses
      let t = 0;
      for (let i = 0; i < 90; i++) { // 1.5 s: springs settle, and nobody blinks before 2 s
        t += 1 / 60;
        for (const [v, f] of views) v.update(f, 1 / 60, null, t);
      }
      // Grape tumbles: a fixed, readable angle
      views[3][0].root.children[0].rotation.set(0.6, 0.4, 1.9);

      renderer.render(scene, camera);
      window.keyartReady = true;
    </script>
  </body>
</html>
